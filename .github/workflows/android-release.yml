name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  apk:
    name: 构建并发布签名 APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android/**/*.gradle*
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: 核对标签与版本
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          grep -Fqx "version = \"$version\"" pyproject.toml
          grep -Fq "versionName = \"$version\"" android/app/build.gradle.kts

      - name: 恢复发布签名
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_RELEASE_KEYSTORE_B64 ANDROID_SIGNING_STORE_PASSWORD ANDROID_SIGNING_KEY_ALIAS ANDROID_SIGNING_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "缺少发布签名配置：$name" >&2
              exit 1
            fi
          done
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/jev-qq-release.jks"
          echo "ANDROID_SIGNING_STORE_FILE=$RUNNER_TEMP/jev-qq-release.jks" >> "$GITHUB_ENV"

      - name: 测试并构建 release APK
        working-directory: android
        env:
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: 验证签名并生成下载文件
        shell: bash
        run: |
          set -euo pipefail
          apk="$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          mkdir -p release
          cp "$apk" "release/jev-qq-analyst-android-${GITHUB_REF_NAME}.apk"
          cp "$apk" release/jev-qq-analyst-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release/*.apk

  windows:
    name: 构建 Windows EXE
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - name: Windows 回归
        run: uv run --locked --python 3.13 python -m unittest discover -s tests -p test_windows_adapter.py
      - name: 构建 EXE
        run: uv run --locked --python 3.13 --with pyinstaller==6.16.0 python -m PyInstaller --noconfirm --distpath packaging/dist --workpath packaging/build packaging/jev-qq-analyst.spec
      - name: EXE 启动自检
        shell: pwsh
        run: |
          $marker = Join-Path $env:RUNNER_TEMP 'jev-self-check.txt'
          $process = Start-Process -FilePath packaging/dist/jev-qq-analyst.exe -ArgumentList @('--self-check', $marker) -Wait -PassThru
          if ($process.ExitCode -ne 0 -or !(Test-Path $marker)) { throw 'EXE 启动自检失败' }
      - name: 准备下载文件
        shell: pwsh
        run: |
          $versioned = "jev-qq-analyst-windows-$env:GITHUB_REF_NAME.exe"
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item packaging/dist/jev-qq-analyst.exe "release/$versioned"
          Copy-Item packaging/dist/jev-qq-analyst.exe release/jev-qq-analyst-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/*.exe

  macos_bundle:
    name: 构建 macOS arm64 APP
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - name: 检查锁文件
        run: uv lock --check
      - name: 构建并验证 APP 压缩包
        run: ./packaging/release.sh --out "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: ${{ runner.temp }}/release/*.zip

  publish:
    name: 发布三端产物
    needs: [apk, windows, macos_bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: 生成校验文件并发布
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd release && sha256sum *.apk *.exe *.zip > SHA256SUMS)
          assets=(release/*.apk release/*.exe release/*.zip release/SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            args=("$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --title "jev-qq-analyst $GITHUB_REF_NAME" --latest)
            notes=".github/release-notes/$GITHUB_REF_NAME.md"
            if [[ -f "$notes" ]]; then
              args+=(--notes-file "$notes")
            else
              args+=(--generate-notes)
            fi
            gh release create "${args[@]}"
          fi
