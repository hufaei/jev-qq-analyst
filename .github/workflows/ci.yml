# CI：PR 与 main push 自动跑离线回归（合成 QQ 辅助功能树，不读屏、不调 API、不读凭据）。
# 测试导入 Quartz（pyobjc），必须 macOS runner；本仓库公开，macOS runner 免费不计费。
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 同一分支的新 run 取消同 ref 的旧 run，省排队时间
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: 离线回归 (unittest)
    runs-on: macos-latest
    # 余量包括 macOS runner 冷启动和首次依赖安装
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      # 注：setup-uv 自 v8 起不再发布 @v8 这类 major tag，须 pin 完整版本号
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: 离线回归
        run: uv run python -B -m unittest discover -s tests

      - name: 启动器离线回归
        run: uv run python -B probe/bootstrap_regression.py

  android:
    name: Android 单元测试与 APK 构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android/**/*.gradle*
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Android 离线回归与构建
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

  windows:
    name: Windows 回归与 EXE 构建
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - name: Windows 回归
        run: uv run --locked --python 3.13 python -m unittest discover -s tests -p test_windows_adapter.py
      - name: 构建 EXE
        run: uv run --locked --python 3.13 --with pyinstaller==6.16.0 python -m PyInstaller --noconfirm --distpath packaging/dist --workpath packaging/build packaging/jev-qq-analyst.spec
      - name: 检查产物
        shell: pwsh
        run: |
          if (!(Test-Path packaging/dist/jev-qq-analyst.exe)) { throw 'EXE 未生成' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: packaging/dist/jev-qq-analyst.exe

  macos_bundle:
    name: macOS arm64 APP 构建
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - name: 检查锁文件
        run: uv lock --check
      - name: 构建并验证 APP 压缩包
        run: ./packaging/release.sh --out "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: ${{ runner.temp }}/release/*.zip
