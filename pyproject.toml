[project]
name = "jev-qq-analyst"
version = "0.7.1"
description = "macOS、Windows 与 Android QQ 可见消息的 Jev 意图与风险分析悬浮窗"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyobjc-framework-applicationservices>=12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-cocoa>=12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=12.2.2; sys_platform == 'darwin'",
    "uiautomation>=2.0; sys_platform == 'win32'",
    "psutil>=5.9; sys_platform == 'win32'",
]
